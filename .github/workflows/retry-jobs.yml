# Optional: Vercel Hobby crons run at most once a day. This pings the retry
# endpoint hourly so failed jobs and acknowledgement reminders run sooner.
# Enable by adding two repository secrets: APP_BASE_URL and CRON_SECRET
# (same values as in Vercel). Without them the job does nothing.
name: retry-jobs
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/jobs/retry
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "secrets not set; skipping"; exit 0; fi
          curl -fsS -m 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_BASE_URL/api/jobs/retry"
